name: Windows installer release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Future release tag for download URLs (for example v0.2.2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build -- --configLoader native
      - name: Install application and packager
        run: |
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pip install ".[dev,web,intel,alignment,qwen,cuda]" "pyinstaller>=6,<7" "pyinstaller-hooks-contrib>=2025.1"
          python -c "import torch; assert torch.version.cuda is None, 'Expected CPU PyTorch'"
      - name: Verify installer payload handling
        run: python -m pytest tests/test_installer.py -q
      - name: Prepare bundled NLTK corpus
        env:
          NLTK_DATA: ${{ github.workspace }}/build/nltk_data
        run: |
          New-Item -ItemType Directory -Force -Path $env:NLTK_DATA | Out-Null
          python -c "import nltk; assert nltk.download('cmudict', download_dir=r'$env:NLTK_DATA', quiet=True), 'cmudict download failed'"
          python -c "import nltk; nltk.data.path.insert(0, r'$env:NLTK_DATA'); nltk.data.find('corpora/cmudict')"
      - name: Bundle Windows application
        env:
          MADNOLIA_INCLUDE_CUDA: "1"
          NLTK_DATA: ${{ github.workspace }}/build/nltk_data
        run: python -m PyInstaller --noconfirm --clean Madnolia.spec
      - name: Prepare application files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist/Madnolia/web | Out-Null
          Copy-Item -Recurse web/dist dist/Madnolia/web/dist
          Copy-Item README-portable.md dist/Madnolia/README.md
      - name: Check bundled application
        shell: pwsh
        run: |
          foreach ($file in @('Madnolia.exe', 'MadnoliaLauncher.exe', '_internal/jamo/data/U+11xx.json', '_internal/cuda/cublas64_12.dll', '_internal/cuda/cudart64_12.dll')) {
            if (-not (Test-Path "dist/Madnolia/$file")) { throw "Missing application file: $file" }
          }
          if (Test-Path dist/Madnolia/installed.marker) { throw 'Portable build must not contain installed.marker' }
          python installer/check_bundle.py --bundle dist/Madnolia
          if ($LASTEXITCODE -ne 0) { throw 'Bundled faster-whisper VAD asset check failed' }
          & dist/Madnolia/Madnolia.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Bundled executable did not start' }
          $process = Start-Process dist/Madnolia/Madnolia.exe -ArgumentList 'viewer', '--port', '18763' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($attempt = 0; $attempt -lt 90; $attempt++) {
              if ($process.HasExited) { throw 'Server exited before startup' }
              try {
                $health = Invoke-RestMethod http://127.0.0.1:18763/api/health
                if ($health.status -eq 'ok') { $ready = $true; break }
              } catch { Start-Sleep -Seconds 1 }
            }
            if (-not $ready) { throw 'Server health check timed out' }
            $page = Invoke-WebRequest http://127.0.0.1:18763/
            if ($page.Content -notmatch '<div id="root">') { throw 'Bundled frontend is missing' }
          } finally { Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue }
      - name: Package verified release payload
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.release_tag }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          $portableArchive = "$pwd/Madnolia-Portable-windows-x64.zip"
          [System.IO.Compression.ZipFile]::CreateFromDirectory((Resolve-Path dist/Madnolia), $portableArchive)
          $portableSize = (Get-Item $portableArchive).Length
          if ($portableSize -ge 2000000000) { throw "Portable ZIP exceeds GitHub's 2 GB per-asset limit ($portableSize bytes)" }
          python installer/package_release.py --archive $portableArchive --output dist/installer --repository "$env:RELEASE_REPOSITORY" --tag "$env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) { throw 'Installer payload packaging failed' }
          $portableHash = (Get-FileHash $portableArchive -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content dist/installer/SHA256SUMS.txt "$portableHash  Madnolia-Portable-windows-x64.zip"
          Move-Item $portableArchive dist/installer/Madnolia-Portable-windows-x64.zip
      - name: Install Inno Setup compiler
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe -OutFile "$env:RUNNER_TEMP/innosetup.exe"
          $signature = Get-AuthenticodeSignature "$env:RUNNER_TEMP/innosetup.exe"
          if ($signature.Status -ne 'Valid' -or $signature.SignerCertificate.Subject -notmatch 'CN=Pyrsys B\.V\.') { throw 'Inno Setup signature verification failed' }
          $compiler = Start-Process "$env:RUNNER_TEMP/innosetup.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-' -PassThru -Wait -WindowStyle Hidden
          if ($compiler.ExitCode -ne 0) { throw 'Inno Setup compiler installation failed' }
      - name: Build online installer
        shell: pwsh
        run: |
          & "${env:ProgramFiles(x86)}/Inno Setup 6/ISCC.exe" dist/installer/Madnolia.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer compilation failed' }
          $setup = Get-Item dist/installer/Madnolia-Setup.exe
          $hash = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          Add-Content dist/installer/SHA256SUMS.txt "$hash  Madnolia-Setup.exe"
      - name: Upload review artifacts
        uses: actions/upload-artifact@v6
        with:
          name: Madnolia-windows-installer
          path: |
            dist/installer/Madnolia-Setup.exe
            dist/installer/Madnolia-Portable-windows-x64.zip
            dist/installer/Madnolia-windows-x64.part*
            dist/installer/SHA256SUMS.txt
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem dist/installer/Madnolia-windows-x64.part* | Select-Object -ExpandProperty FullName)
          $assets += (Resolve-Path dist/installer/Madnolia-Setup.exe).Path
          $assets += (Resolve-Path dist/installer/Madnolia-Portable-windows-x64.zip).Path
          $assets += (Resolve-Path dist/installer/SHA256SUMS.txt).Path
          gh release create "$env:RELEASE_TAG" @assets --title "Madnolia $env:RELEASE_TAG" --notes-file README-portable.md --verify-tag
          if ($LASTEXITCODE -ne 0) { throw 'Release publishing failed' }
