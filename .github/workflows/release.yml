name: Windows portable release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - uses: jakoch/install-vulkan-sdk-action@v1.6.0
        with:
          cache: true
      - name: Build AMD Vulkan transcription engine
        shell: pwsh
        run: |
          git clone --depth 1 --branch v1.9.4 https://github.com/ggml-org/whisper.cpp.git whisper.cpp
          cmake -S whisper.cpp -B whisper.cpp/build -A x64 -DGGML_VULKAN=ON -DWHISPER_BUILD_TESTS=OFF -DGGML_NATIVE=OFF
          cmake --build whisper.cpp/build --config Release --target whisper-cli --parallel 4
          if (-not (Get-ChildItem whisper.cpp/build -Recurse -Filter whisper-cli.exe | Select-Object -First 1)) { throw 'Vulkan whisper-cli build failed' }
      - name: Build frontend
        working-directory: web
        run: |
          npm ci
          npm run build -- --configLoader native
      - name: Install application and packager
        run: |
          python -m pip install ".[web,intel,alignment,cuda]" "pyinstaller>=6,<7" "pyinstaller-hooks-contrib>=2025.1"
      - name: Bundle Windows application
        env:
          MADNOLIA_INCLUDE_CUDA: "0"
        run: python -m PyInstaller --noconfirm --clean Madnolia.spec
      - name: Check bundled startup
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/Madnolia/_internal/jamo/data/U+11xx.json')) { throw 'Jamo pronunciation data is missing' }
          & dist/Madnolia/Madnolia.exe --help | Out-Null
          if ($LASTEXITCODE -ne 0) { throw 'Portable executable did not start' }
          $workerResult = & dist/Madnolia/Madnolia.exe --openvino-worker data/nonexistent CPU
          if ($workerResult -match 'Cannot load library.*openvino_tokenizers') { throw 'OpenVINO Tokenizers DLL is missing' }
      - name: Prepare GPU-specific portable ZIPs
        shell: pwsh
        run: |
          $root = 'dist/Madnolia'
          New-Item -ItemType Directory -Force -Path "$root/data/input/videos", "$root/web" | Out-Null
          Copy-Item -Recurse web/dist "$root/web/dist"
          Copy-Item README-portable.md "$root/README.md"
          Compress-Archive -Path $root -DestinationPath Madnolia-windows-intel-cpu.zip

          $cudaPackages = python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])"
          $cudaPackages = Join-Path $cudaPackages 'nvidia'
          New-Item -ItemType Directory -Force -Path "$root/_internal/cuda" | Out-Null
          foreach ($component in @('cublas', 'cudnn', 'cuda_runtime')) {
            Get-ChildItem (Join-Path $cudaPackages "$component/bin") -Filter '*.dll' | Where-Object { $_.Name -ne 'nvblas64_12.dll' } | Copy-Item -Destination "$root/_internal/cuda" -Force
          }
          if (-not (Test-Path "$root/_internal/cuda/cublas64_12.dll")) { throw 'CUDA libraries are missing' }
          if (-not (Test-Path "$root/_internal/cuda/cudart64_12.dll")) { throw 'CUDA runtime is missing' }
          Compress-Archive -Path $root -DestinationPath Madnolia-windows-nvidia-cuda.zip
          $cudaDirectory = (Resolve-Path "$root/_internal/cuda").Path
          $bundleDirectory = (Resolve-Path $root).Path
          if (-not $cudaDirectory.StartsWith("$bundleDirectory\", [System.StringComparison]::OrdinalIgnoreCase)) { throw 'Invalid CUDA bundle path' }
          Remove-Item -Recurse -LiteralPath $cudaDirectory

          New-Item -ItemType Directory -Force -Path "$root/bin" | Out-Null
          $whisper = Get-ChildItem whisper.cpp/build -Recurse -Filter whisper-cli.exe | Select-Object -First 1
          if (-not $whisper) { throw 'Vulkan whisper-cli build failed' }
          Copy-Item $whisper.FullName -Destination "$root/bin/whisper-cli.exe"
          Get-ChildItem whisper.cpp/build -Recurse -Filter *.dll | Copy-Item -Destination "$root/bin" -Force
          Compress-Archive -Path $root -DestinationPath Madnolia-windows-amd-vulkan.zip
          foreach ($zip in Get-ChildItem Madnolia-windows-*.zip) {
            if ($zip.Length -gt 2GB) { throw "ZIP exceeds the GitHub Release asset size limit: $($zip.Name)" }
            Get-FileHash $zip.FullName -Algorithm SHA256 | Format-List
          }
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: Madnolia-windows-portable-variants
          path: Madnolia-windows-*.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $assets = @(Get-ChildItem Madnolia-windows-*.zip | Select-Object -ExpandProperty FullName)
          if ($assets.Count -ne 3) { throw 'Expected three portable ZIPs' }
          gh release create "${{ github.ref_name }}" @assets --title "Madnolia ${{ github.ref_name }}" --notes-file README-portable.md --verify-tag
